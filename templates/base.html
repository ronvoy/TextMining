<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Legal RAG{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { background: #f4f6f9; }
    .navbar { box-shadow: 0 2px 6px rgba(0,0,0,.25); }
    .nav-link.active { font-weight: 600; }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">⚖️ Legal RAG</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
            <i class="bi bi-house-door"></i> Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/chatbot' %}active{% endif %}" href="/chatbot">
            <i class="bi bi-chat-dots"></i> Chatbot
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/evaluation' %}active{% endif %}" href="/evaluation">
            <i class="bi bi-bar-chart"></i> Evaluation
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main>{% block content %}{% endblock %}</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_script %}{% endblock %}
</body>
</html>
